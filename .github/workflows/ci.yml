name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `npm ci` also runs the postinstall patch for the background-geolocation
      # plugin, which exits non-zero if upstream changes its Package.swift out
      # from under us — that is deliberate and should fail the run.
      - run: npm ci
      # No Supabase/Anthropic/VAPID secrets: the build does not read them at
      # build time and Jest mocks every client, so CI stays secret-free.
      - run: npm run build
      - run: npm test -- --ci

  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # next.config.js sets eslint.ignoreDuringBuilds and
      # typescript.ignoreBuildErrors, so `next build` — here and on Vercel —
      # catches neither. This job is the only thing enforcing them.
      # ESLint warnings stay warnings: `next lint` exits non-zero on errors
      # only, which is the line we want to hold.
      - run: npm run lint
      - run: npx tsc --noEmit

  migrations:
    name: Migration replay
    runs-on: ubuntu-latest
    # Replays every migration against an empty database, the way a Supabase
    # preview branch does. `Supabase Preview` already does this, but it is an
    # external check that went red for weeks and four PRs merged over it — a
    # hardcoded production-only id in 054 aborted the replay at statement 3.
    # This job is the blocking, in-repo version of that safety net.
    #
    # Needs no secrets: it replays the SQL, it never touches production.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        # Without a healthcheck the job races the container's first boot.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # psql ships on ubuntu-latest runners; the script uses it directly
      # rather than Docker when REPLAY_DATABASE_URL is set.
      - name: Replay migrations against an empty database
        env:
          REPLAY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
        run: bash scripts/migration-replay/replay.sh
